name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.8.3

jobs:
  build-test-package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            artifact: daymark-linux
          - name: Windows
            os: windows-2022
            artifact: daymark-windows
          - name: macOS
            os: macos-15
            artifact: daymark-macos

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libgl1-mesa-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Configure
        if: runner.os != 'Windows'
        run: cmake --preset release

      - name: Configure with MSVC
        if: runner.os == 'Windows'
        run: cmake --preset release -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build --preset release --config Release --parallel 2

      - name: Lint QML
        run: cmake --build --preset release --config Release --target daymark_qmllint

      - name: Run tests
        run: ctest --test-dir build/release --build-config Release --output-on-failure

      - name: Package
        run: cpack --config build/release/CPackConfig.cmake -C Release -B build/packages

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: build/packages/Daymark-*
          if-no-files-found: error
          retention-days: 14
